<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body & Mind — Log</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --line:#2a3548; --txt:#e6edf3; --mut:#8b98a9;
          --accent:#5eead4; --accent2:#a78bfa; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  h1 { font-size:22px; margin:0; }
  .date { color:var(--mut); font-size:13px; }
  .pending { display:inline-block; margin:10px 0 18px; padding:6px 12px; border-radius:999px;
             background:rgba(94,234,212,.12); color:var(--accent); font-size:13px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:16px; margin-bottom:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut);
             margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
          background:#0d1320; color:var(--txt); font-size:15px; }
  textarea { resize:vertical; min-height:48px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { cursor:pointer; border:none; border-radius:10px; padding:11px 14px; font-size:15px;
           font-weight:600; background:var(--accent); color:#062a25; margin-top:12px; width:100%; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  .pills { display:flex; gap:8px; }
  .pills button { margin-top:0; background:#0d1320; border:1px solid var(--line); color:var(--txt); font-weight:500; }
  .pills button.sel { background:var(--accent2); color:#160a2e; border-color:var(--accent2); }
  .today { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:#0d1320; border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .stat .v { font-size:18px; font-weight:700; }
  .stat .k { font-size:11px; color:var(--mut); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--accent);
           color:#062a25; padding:10px 18px; border-radius:999px; font-weight:600; opacity:0;
           transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .note { color:var(--mut); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏋️ Body &amp; Mind</h1>
    <span class="date" id="date"></span>
  </header>
  <span class="pending" id="pending">— waiting for Claude</span>

  <div class="card">
    <h2>Log food</h2>
    <textarea id="food" placeholder="e.g. chicken banh mi 326g, extra mayo  ·  150g greek yogurt + banana"></textarea>
    <div class="row">
      <div>
        <label>Meal</label>
        <select id="meal">
          <option>Breakfast</option><option selected>Lunch</option>
          <option>Dinner</option><option>Snack</option>
        </select>
      </div>
      <div>
        <label>Weight (g, optional)</label>
        <input id="food_g" type="number" inputmode="decimal" placeholder="326">
      </div>
    </div>
    <button onclick="logFood()">Add food →</button>
    <div class="note">Free text is fine — Claude estimates the macros.</div>
  </div>

  <div class="card">
    <h2>Quick log</h2>
    <label>Weigh-in (kg)</label>
    <div class="row">
      <input id="weight" type="number" inputmode="decimal" placeholder="71.9">
      <button class="ghost" style="flex:0 0 auto;width:auto;margin-top:0" onclick="logWeight()">Save</button>
    </div>
    <label style="margin-top:6px"><input type="checkbox" id="fasted" style="width:auto;margin-right:6px">fasted (first thing)</label>

    <label>Coffee</label>
    <div class="pills">
      <button data-c="black" onclick="pickCoffee(this)">☕ Black</button>
      <button data-c="milk" onclick="pickCoffee(this)">🥛 Milk</button>
      <button data-c="none" onclick="pickCoffee(this)">None</button>
    </div>

    <label>Sleep score (from Fitbit app)</label>
    <div class="row">
      <input id="sleep" type="number" inputmode="numeric" placeholder="81">
      <button class="ghost" style="flex:0 0 auto;width:auto;margin-top:0" onclick="logSleep()">Save</button>
    </div>
  </div>

  <div class="card">
    <h2>Today (from tracker)</h2>
    <div class="today" id="today">
      <div class="stat"><div class="v" id="t_w">—</div><div class="k">weight</div></div>
      <div class="stat"><div class="v" id="t_s">—</div><div class="k">sleep h</div></div>
      <div class="stat"><div class="v" id="t_st">—</div><div class="k">steps</div></div>
    </div>
    <div class="note">Health stats auto-fill from Google Health on your computer.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
$("date").textContent = new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

async function send(entry){
  const r = await fetch("/log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(entry)});
  const d = await r.json();
  setPending(d.pending);
  toast("Queued ✓ — Claude will log it");
}
function setPending(n){ $("pending").textContent = n>0 ? `${n} entr${n==1?'y':'ies'} waiting for Claude` : "all caught up"; }

function logFood(){
  const text=$("food").value.trim(); if(!text) return toast("type what you ate");
  send({type:"food", meal:$("meal").value, text, grams:$("food_g").value||null});
  $("food").value=""; $("food_g").value="";
}
function logWeight(){
  const kg=$("weight").value; if(!kg) return toast("enter a weight");
  send({type:"weight", kg:Number(kg), fasted:$("fasted").checked}); $("weight").value="";
}
function pickCoffee(b){
  document.querySelectorAll('.pills button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); send({type:"coffee", kind:b.dataset.c});
}
function logSleep(){
  const s=$("sleep").value; if(!s) return toast("enter a score");
  send({type:"sleep_score", score:Number(s)}); $("sleep").value="";
}

async function refresh(){
  try{
    const d = await (await fetch("/today")).json();
    setPending(d.pending);
    const r = d.row||{};
    $("t_w").textContent  = r.Weight_kg || "—";
    $("t_s").textContent  = r.Sleep_hrs || "—";
    $("t_st").textContent = r.Steps ? Number(r.Steps).toLocaleString() : "—";
  }catch(e){}
}
refresh(); setInterval(refresh, 8000);
</script>
</body>
</html>
